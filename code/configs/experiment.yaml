# Experiment Protocol v0.1 - 核心实验语义（冻结）
schema_version: v0.1
status: frozen

epsilon: 0.03
alpha: 0.05
confidence_level: 0.95
non_inferiority_method: mcnemar

repeats:
  calibration: 3
  full_pilot: 5

temperature: 0.0
seed: 42
timeout_seconds: 120
max_retries: 2
retry_backoff_seconds: [1, 5]
failure_policy: mark_failed

reasoning_baseline: max
analysis_variable: reasoning_tokens_observed
art_eligibility: requires_reasoning_token_report
difficulty_scope: within_subset
prompt_neutral: true

pilot_samples:
  math500: 100
  zebralogic_grid: 100
  easy2hard_amc: 100

strata:
  math500:
    method: level
    bins: 5
    per_bin: 20
  zebralogic_grid:
    method: complexity_quintile
    bins: 5
    per_bin: 20
  easy2hard_amc:
    method: difficulty_quintile
    bins: 5
    per_bin: 20

prompt_versions:
  math500: math_v1
  zebralogic_grid: zebra_grid_v1
  easy2hard_amc: e2h_amc_v1
  aime: aime_v1
  gpqa_diamond: gpqa_v1
  livecodebench: livecodebench_v1

cost:
  currency: USD
  calibration_budget_per_model: 20.0
  full_pilot_budget: confirm_separately
  dry_run_samples: 10
